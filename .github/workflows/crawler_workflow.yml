name: 24/7 Crawler (3 VPS)

on:
  schedule:
    # Chạy mỗi 5 giờ
    - cron: '0 */1 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-crawler:
    runs-on: windows-latest
    strategy:
      matrix:
        # Sử dụng matrix để sinh ra 3 VPS chạy song song
        vps_id: [1, 2, 3]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyQt5 PyQtWebEngine
        playwright install chromium msedge

    - name: Run Crawler with Auto-run and Real Screen
      run: |
        python tool.py --auto-run
